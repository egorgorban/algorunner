server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache-control for hashed assets (Vite uses content hashing)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No-cache for index.html (app entry point)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: route all non-matching paths to index.html
    location / {
        try_files $uri /index.html;
    }
}
